services:
  dev:
    image: postgres:17.6
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop-local
      POSTGRES_DB: issuetracker
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-54329}:5432'
    volumes:
      - dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workshop -d issuetracker']
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    image: postgres:17.6
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop-local
      POSTGRES_DB: issuetracker_test
    ports:
      - '127.0.0.1:${TEST_DB_PORT:-54330}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workshop -d issuetracker_test']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  dev-data:
